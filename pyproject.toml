[project]
name = "shorty-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Beshenka", email = "mambatamba6@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "pydantic>=2.13.5",
]

[project.scripts]
shorty-bot = "shorty_bot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.9"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "BLE", "PLC", "PLR", "PLW", "SLF"]
# Project-wide ignores: prefer fixing prod code over adding here.
ignore = [
    "D",       # pydocstyle — docstrings are optional, not part of our style guide
    "E501",    # line length — formatter handles wrapping; long strings/URLs stay as-is
    "PLR0911", # too many return statements
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments
]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
